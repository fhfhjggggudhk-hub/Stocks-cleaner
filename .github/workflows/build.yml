name: Build Jarvis APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write Jarvis project files
        run: |
          mkdir -p jarvis && cd jarvis
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'JARVIS_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jarvis"
          include ':app'
          JARVIS_EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          JARVIS_EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          JARVIS_EOF
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'JARVIS_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.jarvis'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.jarvis"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ListenService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
                  <service
                      android:name=".ListenService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
                  <service
                      android:name=".JarvisService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/res/xml/accessibility_config.xml)
          cat > app/src/main/res/xml/accessibility_config.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Jarvis</string>
              <string name="service_desc">Jarvis reads the screen and taps only after you approve each action.</string>
          </resources>
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/java/com/example/jarvis/MainActivity.kt)
          cat > app/src/main/java/com/example/jarvis/MainActivity.kt <<'JARVIS_EOF'
          package com.example.jarvis

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var out: TextView
              private lateinit var hf: Switch
              private val REQ = 11
              private val REQ_PERM = 21

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("jarvis", MODE_PRIVATE)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(40, 110, 40, 40)

                  val sw = Switch(this)
                  sw.text = "জার্ভিস চালু / বন্ধ"
                  sw.textSize = 20f
                  sw.isChecked = p.getBoolean("on", false)
                  sw.setOnCheckedChangeListener { _, c ->
                      p.edit().putBoolean("on", c).apply()
                      log(if (c) "জার্ভিস চালু হয়েছে" else "জার্ভিস বন্ধ হয়েছে")
                  }
                  root.addView(sw)

                  hf = Switch(this)
                  hf.text = "হ্যান্ডস-ফ্রি: জার্ভিস বললে শুনবে"
                  hf.textSize = 16f
                  hf.isChecked = p.getBoolean("hf", false)
                  hf.setOnCheckedChangeListener { _, c ->
                      p.edit().putBoolean("hf", c).apply()
                      if (c) startHandsFree() else stopService(Intent(this, ListenService::class.java))
                  }
                  root.addView(hf)

                  val key = EditText(this)
                  key.hint = "Gemini API Key"
                  key.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  key.setText(p.getString("key", ""))
                  root.addView(key)

                  val model = EditText(this)
                  model.hint = "মডেলের নাম"
                  model.setText(p.getString("model", "gemini-3-flash-preview"))
                  root.addView(model)

                  val wake = EditText(this)
                  wake.hint = "জাগানোর শব্দ (কমা দিয়ে)"
                  val savedWake = p.getString("wake", "") ?: ""
                  wake.setText(if (savedWake.isBlank()) ListenService.DEFAULT_WAKE else savedWake)
                  root.addView(wake)

                  val save = Button(this)
                  save.text = "কী, মডেল ও শব্দ সেভ করুন"
                  save.setOnClickListener {
                      p.edit().putString("key", key.text.toString().trim())
                          .putString("model", model.text.toString().trim())
                          .putString("wake", wake.text.toString().trim()).apply()
                      log("সেভ হয়েছে")
                  }
                  root.addView(save)

                  val acc = Button(this)
                  acc.text = "Accessibility চালু করুন (একবার)"
                  acc.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  root.addView(acc)

                  val mic = Button(this)
                  mic.text = "🎤 বলুন"
                  mic.setOnClickListener { listen() }
                  root.addView(mic)

                  val input = EditText(this)
                  input.hint = "অথবা এখানে লিখুন"
                  root.addView(input)

                  val send = Button(this)
                  send.text = "পাঠান"
                  send.setOnClickListener {
                      val t = input.text.toString().trim()
                      if (t.isNotEmpty()) { input.setText(""); run(t) }
                  }
                  root.addView(send)

                  out = TextView(this)
                  out.textSize = 16f
                  val sc = ScrollView(this)
                  sc.addView(out)
                  root.addView(sc)
                  setContentView(root)

                  JarvisService.log = { msg -> log(msg) }
              }

              private fun log(s: String) { out.append(s + "\n\n") }

              private fun startHandsFree() {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isNotEmpty()) {
                      requestPermissions(need.toTypedArray(), REQ_PERM)
                  } else {
                      launchListen()
                  }
              }

              private fun launchListen() {
                  startForegroundService(Intent(this, ListenService::class.java))
                  log("হ্যান্ডস-ফ্রি চালু। জার্ভিস বলে কাজ বলুন")
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (code == REQ_PERM) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          launchListen()
                      } else {
                          log("মাইকের অনুমতি ছাড়া হ্যান্ডস-ফ্রি চলবে না")
                          hf.isChecked = false
                      }
                  }
              }

              private fun listen() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                  try { startActivityForResult(i, REQ) } catch (e: Exception) { log("ভয়েস ইনপুট পাওয়া যায়নি, লিখে দিন") }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(rq: Int, rc: Int, d: Intent?) {
                  super.onActivityResult(rq, rc, d)
                  if (rq == REQ && rc == RESULT_OK) {
                      d?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()?.let { run(it) }
                  }
              }

              private fun run(text: String) {
                  val p = getSharedPreferences("jarvis", MODE_PRIVATE)
                  if (!p.getBoolean("on", false)) { log("আগে উপরের বাটন চালু করুন"); return }
                  val s = JarvisService.instance
                  if (s == null) { log("আগে Accessibility সেটিংসে Jarvis চালু করুন"); return }
                  log("আপনি: $text")
                  s.runCommand(text)
              }
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/java/com/example/jarvis/JarvisService.kt)
          cat > app/src/main/java/com/example/jarvis/JarvisService.kt <<'JARVIS_EOF'
          package com.example.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean

          class JarvisService : AccessibilityService() {

              companion object {
                  var instance: JarvisService? = null
                  var log: ((String) -> Unit)? = null
                  const val DEFAULT_MODEL = "gemini-3-flash-preview"
                  const val SYSTEM = "You are Jarvis, a personal assistant on the user's Android phone. " +
                      "Always reply in Bengali, short and clear. " +
                      "Use search_web for news, prices, current facts and ideas. " +
                      "To operate the phone use the screen tools one step at a time: read_screen first, then act. " +
                      "Only do exactly what the user asked. Never send messages or emails, submit forms, pay, or log in " +
                      "unless the user explicitly told you to. Never solve CAPTCHAs. " +
                      "If the user denies an action, stop and ask what they want instead."
              }

              private val ui = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              @Volatile var busy = false

              fun speaking(): Boolean = tts?.isSpeaking == true
              @Volatile var confirming = false
              private var answerFn: ((Boolean) -> Unit)? = null

              fun isIdle(): Boolean {
                  val speaking = tts?.isSpeaking == true
                  return !speaking && (!busy || confirming)
              }

              fun speak(t: String) { say(t) }

              fun answerByVoice(v: Boolean) { ui.post { answerFn?.invoke(v) } }

              override fun onServiceConnected() {
                  instance = this
                  tts = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) tts?.language = Locale("bn", "BD") }
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(intent: Intent?): Boolean { instance = null; return super.onUnbind(intent) }
              override fun onDestroy() { instance = null; tts?.shutdown(); super.onDestroy() }

              private fun isOn() = getSharedPreferences("jarvis", MODE_PRIVATE).getBoolean("on", false)

              fun say(t: String) {
                  ui.post { log?.invoke(t) }
                  tts?.speak(t, TextToSpeech.QUEUE_ADD, null, null)
              }

              fun runCommand(text: String) {
                  if (busy) { say("আমি এখন আরেকটা কাজে ব্যস্ত"); return }
                  val key = getSharedPreferences("jarvis", MODE_PRIVATE).getString("key", "") ?: ""
                  if (key.isBlank()) { say("আগে API কী সেভ করুন"); return }
                  busy = true
                  Thread {
                      try { agent(text, key) } catch (e: Exception) { say("ত্রুটি: ${e.message}") } finally { busy = false }
                  }.start()
              }

              // ---------- Gemini loop ----------
              private fun agent(userText: String, key: String) {
                  val saved = getSharedPreferences("jarvis", MODE_PRIVATE).getString("model", "") ?: ""
                  val model = if (saved.isBlank()) DEFAULT_MODEL else saved
                  val contents = JSONArray().put(
                      JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", userText)))
                  )
                  for (step in 0 until 8) {
                      if (!isOn()) { say("জার্ভিস বন্ধ আছে"); return }
                      val body = JSONObject()
                          .put("system_instruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYSTEM))))
                          .put("contents", contents)
                          .put("tools", JSONArray().put(JSONObject().put("function_declarations", declarations())))
                      val resp = post(key, model, body)
                      val content = resp.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")
                      val parts = content?.optJSONArray("parts")
                      if (content == null || parts == null) { say("উত্তর পাওয়া যায়নি, আবার চেষ্টা করুন"); return }
                      contents.put(content)
                      val results = JSONArray()
                      val text = StringBuilder()
                      for (i in 0 until parts.length()) {
                          val p = parts.getJSONObject(i)
                          if (p.has("functionCall")) {
                              val fc = p.getJSONObject("functionCall")
                              val
